[package]
name = "mclr"
version = "2.3.5"
edition = "2021"
authors = ["k3nder"]
rust-version = "1.71.0"
description = "run mc in rust"
documentation = "https://github.com"
readme = "README.md"
homepage = "https://github.com"
repository = "https://github.com/k3nder/mclr.git"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.201", features = ["derive"] }
bytes = "1.6.0"
ureq = {version = "3.0.5"}
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.117"
zip = "2.1.0"
tar = "0.4.40"
flate2 = "1.0.30"
hex = "0.4.3"
url = "2.5.4"
rustls = "0.23.22"