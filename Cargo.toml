[package]
name = "mclr"
version = "3.1.3"
edition = "2021"
authors = ["k3nder"]
rust-version = "1.71.0"
description = "run mc in rust"
documentation = "https://github.com"
readme = "README.md"
homepage = "https://github.com"
repository = "https://github.com/k3nder/mclr.git"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.201", features = ["derive"] }
dwldutil = { version = "2.0.1", features = [
    "normal_zip",
    "gzip",
    "decompress",
    "cas",
] }
serde_json = "1.0.117"
url = "2.5.4"
log = "0.4.17"
env_logger = "0.10.0"

[patch.crates-io]
dwldutil = { path = "./dwldutil" }
